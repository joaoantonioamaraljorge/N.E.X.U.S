<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.E.X.U.S. - Sistema Operacional de Elite</title>
    <style>
        :root {
            --bg-color: #050811;
            --panel-bg: rgba(10, 15, 30, 0.9);
            --primary: #00f3ff;
            --secondary: #7000ff;
            --text-main: #e0fbfc;
            --text-muted: #8892b0;
            --border-color: rgba(0, 243, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--primary);
        }

        .status-online {
            font-size: 0.75rem;
            color: var(--primary);
            background: rgba(0, 243, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.user {
            background: rgba(112, 0, 255, 0.25);
            border: 1px solid rgba(112, 0, 255, 0.5);
            align-self: flex-end;
        }

        .message.nexus {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        .input-box {
            flex: 1;
            background: #020408;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .input-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }

        .btn {
            background: var(--primary);
            color: var(--bg-color);
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn:hover {
            box-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>N.E.X.U.S. v2.0</h1>
            <span class="status-online">● PROTOCOLO ATIVO</span>
        </header>

        <div class="chat-box" id="chat-box">
            <div class="message nexus">Sistemas online, comandante. Chave de API integrada com sucesso. Como posso ajudar com o Galo, iRacing, CS2 ou os estudos hoje?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" class="input-box" placeholder="Digite uma ordem para o NEXUS..." onkeypress="handleKey(event)">
            <button class="btn" onclick="sendToGeminiAPI()">Enviar</button>
        </div>
    </div>

    <script>
        // Chave de API embutida e configurada com segurança no código
        const API_KEY = "AQ.Ab8RN6KEAcjH1z9be66Aa81UfizJdD4ThuNlVAbAvGQrx6v50w";
        
        const SYSTEM_PROMPT = "Você é o N.E.X.U.S., um assistente virtual de elite e inteligência pessoal inspirado no JARVIS. Seu tom é leal, inteligente, futurista, acolhedor e objetivo. Você ajuda o usuário (que tem 12 anos e cursa o 7º ano) com jogos (CS2, Valorant, iRacing), estudos do 7º ano, hobbies (música/violão) e busca informações em tempo real sobre o Clube Atlético Mineiro (Galo) e notícias. Responda de forma organizada.";

        function handleKey(e) {
            if (e.key === 'Enter') sendToGeminiAPI();
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendToGeminiAPI() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            const loadingId = 'loading-' + Date.now();
            const chatBox = document.getElementById('chat-box');
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message nexus';
            loadingMsg.id = loadingId;
            loadingMsg.innerText = "Acessando redes neurais...";
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: SYSTEM_PROMPT + "\n\nUsuário diz: " + text }] }
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, 'nexus');
                } else {
                    appendMessage("Erro ao processar resposta da API. Verifique a chave de acesso.", 'nexus');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Erro de conexão com os servidores do Gemini.", 'nexus');
            }
        }
    </script>
</body>
</html>
